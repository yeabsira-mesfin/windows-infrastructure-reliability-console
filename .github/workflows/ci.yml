name: Windows Infrastructure Project CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React console
        run: npm run build
      - name: Run PowerShell infrastructure checks
        shell: pwsh
        run: ./tests/Run-Tests.ps1
